# Respuesta a un open (sin 3-bets previos). Clave: <héroe>_vs_<grupo del que abre>.
# Héroe: IP (posición sin ciega que actúa después), SB, BB.
# Grupos que abren: EP = UTG/UTG1/MP, MP = LJ/HJ, LATE = CO/BTN/SB.
# Contra opens de 5 bb en vivo los rangos de call son más estrechos que online.
# Lo que no está en 3bet ni call es fold. 3bet y call no deben solaparse.
# APROXIMADOS Y EDITABLES.
groups:
  EP: [UTG, UTG1, MP]
  MP: [LJ, HJ]
  LATE: [CO, BTN, SB]
spots:
  IP_vs_EP:
    3bet: "QQ+, AKs, AKo"
    call: "JJ-66, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 98s, AQo"
  IP_vs_MP:
    3bet: "QQ+, AKs, AQs, AKo"
    call: "JJ-44, AJs, ATs, KQs, KJs, QJs, JTs, T9s, 98s, 87s, AQo"
  IP_vs_LATE:
    3bet: "JJ+, AQs+, AKo, A5s, A4s, KQs"
    call: "TT-22, AJs, ATs, A9s, KJs, KTs, QJs, QTs, JTs, J9s, T9s, 98s, 87s, 76s, 65s, AQo, AJo, KQo"
  SB_vs_EP:
    3bet: "QQ+, AKs, AKo"
    call: "JJ-66, AQs, KQs"
  SB_vs_MP:
    3bet: "JJ+, AQs+, AKo"
    call: "TT-55, AJs, KQs, QJs, JTs"
  SB_vs_LATE:
    3bet: "TT+, AJs+, KJs+, AQo+, A5s, A4s"
    call: "99-22, ATs, KTs, QJs, JTs, T9s, 98s"
  BB_vs_EP:
    3bet: "QQ+, AKs, AKo"
    call: "JJ-22, AQs, AJs, ATs, KQs, KJs, QJs, JTs, T9s, 98s, 87s, 76s, AQo"
  BB_vs_MP:
    3bet: "QQ+, AKs, AQs, AKo"
    call: "JJ-22, AJs-A2s, KQs, KJs, KTs, QJs, QTs, JTs, J9s, T9s, 98s, 87s, 76s, 65s, AQo, AJo, KQo"
  BB_vs_LATE:
    3bet: "TT+, AJs+, KQs, AQo+, A5s, A4s"
    call: "99-22, ATs-A6s, A3s, A2s, KJs, KTs, K9s, QJs, QTs, Q9s, JTs, J9s, T9s, T8s, 98s, 97s, 87s, 86s, 76s, 65s, 54s, AJo, ATo, KQo, KJo, QJo"
