# Modelo simplificado de cada perfil de rival (fracciones de su rango en esa calle).
#   call:       fracción de su rango que paga una apuesta tuya (su mejor X %)
#   bet_value:  fracción con la que apuesta por valor (su mejor X %)
#   bet_bluff:  fracción con la que farolea (su peor X %)
# drill_call / drill_bet: si el perfil aparece en los drills de river.
# APROXIMADOS Y EDITABLES: ajústalos a lo que ves en tus mesas.
unknown:         {label: "desconocido", call: 0.45, bet_value: 0.25, bet_bluff: 0.08}
nit:             {label: "nit", call: 0.25, bet_value: 0.15, bet_bluff: 0.0, drill_call: true, drill_bet: true}
regular:         {label: "regular", call: 0.45, bet_value: 0.25, bet_bluff: 0.08, drill_call: true, drill_bet: true}
calling_station: {label: "calling station", call: 0.70, bet_value: 0.20, bet_bluff: 0.03, drill_call: true}
lag:             {label: "agresivo (LAG)", call: 0.45, bet_value: 0.30, bet_bluff: 0.20, drill_bet: true}
maniac:          {label: "maníaco", call: 0.60, bet_value: 0.40, bet_bluff: 0.35}
